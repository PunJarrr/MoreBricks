name: Publish

# Runs when a GitHub release is published: builds every version, uploads them to
# Modrinth and CurseForge, and attaches the jars to the release.
# Needs repository secrets MODRINTH_TOKEN and CURSEFORGE_TOKEN.

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            17
            21
            25

      - uses: gradle/actions/setup-gradle@v4

      - name: Check the release tag matches the mod version
        run: |
          expected="v$(grep -E '^mod.version' stonecutter.properties.toml | cut -d'"' -f2)"
          if [ "$GITHUB_REF_NAME" != "$expected" ]; then
            echo "Release tag $GITHUB_REF_NAME does not match mod.version ($expected)"; exit 1
          fi

      - name: Build and upload to Modrinth and CurseForge
        run: ./gradlew buildAndCollect publishMods --max-workers 2
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
          CHANGELOG: ${{ github.event.release.body }}

      - name: Attach jars to the GitHub release
        run: gh release upload "$GITHUB_REF_NAME" build/libs/*/*.jar --clobber
        env:
          GH_TOKEN: ${{ github.token }}
